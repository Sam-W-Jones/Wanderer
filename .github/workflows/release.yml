name: Release

# Push a tag like v0.2.0 and this creates the GitHub release (notes from docs/releases/<tag>.md when present),
# stamps module.json with the version and repository URLs, zips the module, and attaches module.json + module.zip.
# Install URL for players: https://github.com/Sam-W-Jones/Wanderer/releases/latest/download/module.json

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp module.json
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg u "https://github.com/$REPO" \
             --arg m "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $v | .url = $u | .manifest = $m | .download = $d' \
             module.json > module.json.tmp
          mv module.json.tmp module.json
          cat module.json

      - name: Zip the module
        run: zip -r module.zip module.json README.md CHANGELOG.md lang scripts styles templates assets packs -x "packs/*/LOCK" "packs/*/LOG" "packs/*/LOG.old"

      - name: Create the release if it does not exist
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          elif [ -f "docs/releases/$TAG.md" ]; then
            gh release create "$TAG" --title "The Wanderer's Core $TAG" --notes-file "docs/releases/$TAG.md"
          else
            gh release create "$TAG" --title "The Wanderer's Core $TAG" --generate-notes
          fi

      - name: Attach assets to the release
        run: gh release upload "$TAG" module.json module.zip --clobber
