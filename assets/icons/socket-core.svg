<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="gold" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff6d0"/>
      <stop offset="28%" stop-color="#f3cf6a"/>
      <stop offset="62%" stop-color="#c08f1b"/>
      <stop offset="88%" stop-color="#6e4a0a"/>
      <stop offset="100%" stop-color="#3a2604"/>
    </radialGradient>
    <radialGradient id="heart" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#bff0ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#5fc8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5fc8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff1c0" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#fff1c0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff1c0" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <clipPath id="sphere"><circle cx="50" cy="50" r="46"/></clipPath>
  </defs>

  <!-- halo -->
  <circle cx="50" cy="50" r="46" fill="#f3cf6a" opacity="0.35" filter="url(#softglow)"/>
  <!-- sphere -->
  <circle cx="50" cy="50" r="46" fill="url(#gold)"/>

  <!-- engraved rings and ticks on the sphere surface -->
  <g clip-path="url(#sphere)" stroke="#5a3b06" stroke-width="0.9" fill="none" opacity="0.75">
    <circle cx="50" cy="50" r="39"/>
    <circle cx="50" cy="50" r="31"/>
    <g id="ticks">
      <path d="M50 11 L50 15"/><path d="M50 11 L50 15" transform="rotate(15 50 50)"/><path d="M50 11 L50 15" transform="rotate(30 50 50)"/>
      <path d="M50 11 L50 15" transform="rotate(45 50 50)"/><path d="M50 11 L50 15" transform="rotate(60 50 50)"/><path d="M50 11 L50 15" transform="rotate(75 50 50)"/>
      <path d="M50 11 L50 15" transform="rotate(90 50 50)"/><path d="M50 11 L50 15" transform="rotate(105 50 50)"/><path d="M50 11 L50 15" transform="rotate(120 50 50)"/>
      <path d="M50 11 L50 15" transform="rotate(135 50 50)"/><path d="M50 11 L50 15" transform="rotate(150 50 50)"/><path d="M50 11 L50 15" transform="rotate(165 50 50)"/>
      <path d="M50 11 L50 15" transform="rotate(180 50 50)"/><path d="M50 11 L50 15" transform="rotate(195 50 50)"/><path d="M50 11 L50 15" transform="rotate(210 50 50)"/>
      <path d="M50 11 L50 15" transform="rotate(225 50 50)"/><path d="M50 11 L50 15" transform="rotate(240 50 50)"/><path d="M50 11 L50 15" transform="rotate(255 50 50)"/>
      <path d="M50 11 L50 15" transform="rotate(270 50 50)"/><path d="M50 11 L50 15" transform="rotate(285 50 50)"/><path d="M50 11 L50 15" transform="rotate(300 50 50)"/>
      <path d="M50 11 L50 15" transform="rotate(315 50 50)"/><path d="M50 11 L50 15" transform="rotate(330 50 50)"/><path d="M50 11 L50 15" transform="rotate(345 50 50)"/>
    </g>
  </g>

  <!-- glyphs between the rings -->
  <g clip-path="url(#sphere)" stroke="#fff3cc" stroke-width="1.1" stroke-linecap="round" fill="none" filter="url(#glow)" opacity="0.9">
    <g transform="translate(50 15)"><path d="M0 -2.5 L0 2.5 M0 -2.5 L2 -1 M0 0.5 L2 2"/></g>
    <g transform="rotate(45 50 50) translate(50 15)"><path d="M0 2.5 L0 -2.5 M0 -0.5 L-2 -2.5 M0 -0.5 L2 -2.5"/></g>
    <g transform="rotate(90 50 50) translate(50 15)"><path d="M0 -2.5 L0 2.5 M0 -1.5 L2 0 L0 1.5"/></g>
    <g transform="rotate(135 50 50) translate(50 15)"><path d="M-2 -1.5 L0 -2.5 L2 -1.5 M0 -2.5 L0 2.5"/></g>
    <g transform="rotate(180 50 50) translate(50 15)"><path d="M-2 2.5 L2 -2.5 M-2 -2.5 L2 2.5"/></g>
    <g transform="rotate(225 50 50) translate(50 15)"><path d="M0 -2.5 L0 2.5 M-2 0 L2 0"/></g>
    <g transform="rotate(270 50 50) translate(50 15)"><path d="M-2 2.5 L0 -2.5 L2 2.5"/></g>
    <g transform="rotate(315 50 50) translate(50 15)"><path d="M-2 -2.5 L2 -2.5 M0 -2.5 L0 2.5 M-2 2.5 L2 2.5"/></g>
  </g>

  <!-- pentacle -->
  <circle cx="50" cy="50" r="24" fill="none" stroke="#fff6dc" stroke-width="1.6" filter="url(#glow)"/>
  <path d="M50 26 L64.1 69.4 L27.2 42.6 L72.8 42.6 L35.9 69.4 Z" fill="none" stroke="#fffaf0" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- the heart light -->
  <circle cx="50" cy="50" r="13" fill="url(#heart)"/>
  <circle cx="50" cy="50" r="4" fill="#ffffff" filter="url(#glow)"/>

  <!-- orbit rings -->
  <ellipse cx="50" cy="50" rx="48" ry="15" fill="none" stroke="url(#orbit)" stroke-width="1.4" transform="rotate(-24 50 50)"/>
  <ellipse cx="50" cy="50" rx="48" ry="11" fill="none" stroke="url(#orbit)" stroke-width="1" transform="rotate(38 50 50)" opacity="0.8"/>

  <!-- specular -->
  <ellipse cx="37" cy="29" rx="13" ry="7" fill="#ffffff" opacity="0.32" transform="rotate(-25 37 29)"/>
  <!-- rim -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#ffe9a6" stroke-width="1.5" filter="url(#glow)"/>
</svg>
