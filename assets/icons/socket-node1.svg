<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="stone" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d9ecff"/>
      <stop offset="25%" stop-color="#6aa8e6"/>
      <stop offset="60%" stop-color="#244f8f"/>
      <stop offset="88%" stop-color="#0f2449"/>
      <stop offset="100%" stop-color="#07132a"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="sphere"><circle cx="50" cy="50" r="46"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#2d9bff" opacity="0.35" filter="url(#softglow)"/>
  <circle cx="50" cy="50" r="46" fill="url(#stone)"/>
  <!-- cracks in the stone -->
  <g clip-path="url(#sphere)" stroke="#9fd4ff" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M14 30 L24 36 L22 48"/><path d="M80 22 L72 34 L78 44"/><path d="M30 86 L40 76 L54 80"/><path d="M68 90 L64 78 L74 70"/>
  </g>
  <!-- equatorial rune band -->
  <g clip-path="url(#sphere)">
    <ellipse cx="50" cy="52" rx="43" ry="14" fill="none" stroke="#9fe3ff" stroke-width="1.3" opacity="0.85" filter="url(#glow)"/>
    <ellipse cx="50" cy="52" rx="43" ry="9" fill="none" stroke="#9fe3ff" stroke-width="0.6" opacity="0.45"/>
    <g stroke="#e6f7ff" stroke-width="1.3" stroke-linecap="round" fill="none" filter="url(#glow)">
      <g transform="translate(89.5 56.8) scale(0.34 1)"><path d="M0 -4 L0 4 M0 -4 L3 -2 M0 0 L3 2"/></g>
      <g transform="translate(77 62.7) scale(0.77 1)"><path d="M0 4 L0 -4 M0 -1 L-3 -4 M0 -1 L3 -4"/></g>
      <g transform="translate(50 66)"><path d="M0 -4 L0 4 M0 -2 L3 0 L0 2"/></g>
      <g transform="translate(23 62.7) scale(0.77 1)"><path d="M-3 -2 L0 -4 L3 -2 M0 -4 L0 4"/></g>
      <g transform="translate(10.5 56.8) scale(0.34 1)"><path d="M-3 4 L3 -4 M-3 -4 L3 4"/></g>
    </g>
  </g>
  <!-- central glyph -->
  <circle cx="50" cy="38" r="9" fill="none" stroke="#bfe9ff" stroke-width="1.4" filter="url(#glow)"/>
  <path d="M50 31 L56 44 L44 44 Z" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- specular and rim -->
  <ellipse cx="37" cy="28" rx="12" ry="6.5" fill="#ffffff" opacity="0.28" transform="rotate(-25 37 28)"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#7cc4ff" stroke-width="1.5" filter="url(#glow)"/>
</svg>
