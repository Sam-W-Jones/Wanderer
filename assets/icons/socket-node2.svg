<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="stone" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d9ecff"/>
      <stop offset="25%" stop-color="#6aa8e6"/>
      <stop offset="60%" stop-color="#244f8f"/>
      <stop offset="88%" stop-color="#0f2449"/>
      <stop offset="100%" stop-color="#07132a"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="sphere"><circle cx="50" cy="50" r="46"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#2d9bff" opacity="0.35" filter="url(#softglow)"/>
  <circle cx="50" cy="50" r="46" fill="url(#stone)"/>
  <g clip-path="url(#sphere)" stroke="#9fd4ff" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M18 70 L28 62 L26 50"/><path d="M84 66 L74 58 L78 46"/><path d="M40 12 L46 22 L38 30"/>
  </g>
  <!-- two crossing rune bands -->
  <g clip-path="url(#sphere)">
    <ellipse cx="50" cy="50" rx="43" ry="13" fill="none" stroke="#9fe3ff" stroke-width="1.2" opacity="0.8" transform="rotate(-30 50 50)" filter="url(#glow)"/>
    <ellipse cx="50" cy="50" rx="43" ry="13" fill="none" stroke="#9fe3ff" stroke-width="1.2" opacity="0.8" transform="rotate(30 50 50)" filter="url(#glow)"/>
    <g stroke="#e6f7ff" stroke-width="1.3" stroke-linecap="round" fill="none" filter="url(#glow)">
      <g transform="rotate(-30 50 50) translate(50 63)"><path d="M0 -4 L0 4 M-3 -2 L0 -4 L3 -2"/></g>
      <g transform="rotate(-30 50 50) translate(74 58) scale(0.8 1)"><path d="M0 -4 L0 4 M0 -2 L3 0 L0 2"/></g>
      <g transform="rotate(-30 50 50) translate(26 58) scale(0.8 1)"><path d="M0 4 L0 -4 M0 -1 L-3 -4 M0 -1 L3 -4"/></g>
      <g transform="rotate(30 50 50) translate(50 63)"><path d="M-3 4 L3 -4 M-3 -4 L3 4"/></g>
      <g transform="rotate(30 50 50) translate(74 58) scale(0.8 1)"><path d="M0 -4 L0 4 M-3 0 L3 0"/></g>
      <g transform="rotate(30 50 50) translate(26 58) scale(0.8 1)"><path d="M-3 4 L0 -4 L3 4"/></g>
    </g>
  </g>
  <!-- central glyph -->
  <circle cx="50" cy="36" r="9" fill="none" stroke="#bfe9ff" stroke-width="1.4" filter="url(#glow)"/>
  <path d="M50 29 L56 36 L50 43 L44 36 Z" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round" filter="url(#glow)"/>
  <ellipse cx="37" cy="28" rx="12" ry="6.5" fill="#ffffff" opacity="0.28" transform="rotate(-25 37 28)"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#7cc4ff" stroke-width="1.5" filter="url(#glow)"/>
</svg>
