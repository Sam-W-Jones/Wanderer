<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="stone" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d9ecff"/>
      <stop offset="25%" stop-color="#6aa8e6"/>
      <stop offset="60%" stop-color="#244f8f"/>
      <stop offset="88%" stop-color="#0f2449"/>
      <stop offset="100%" stop-color="#07132a"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="sphere"><circle cx="50" cy="50" r="46"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#2d9bff" opacity="0.35" filter="url(#softglow)"/>
  <circle cx="50" cy="50" r="46" fill="url(#stone)"/>
  <g clip-path="url(#sphere)" stroke="#9fd4ff" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M12 44 L22 50 L20 62"/><path d="M86 40 L76 48 L82 60"/><path d="M44 90 L50 80 L60 86"/>
  </g>
  <!-- three latitude rings with glyphs -->
  <g clip-path="url(#sphere)">
    <ellipse cx="50" cy="34" rx="33" ry="8" fill="none" stroke="#9fe3ff" stroke-width="1.1" opacity="0.75" filter="url(#glow)"/>
    <ellipse cx="50" cy="52" rx="44" ry="11" fill="none" stroke="#9fe3ff" stroke-width="1.3" opacity="0.85" filter="url(#glow)"/>
    <ellipse cx="50" cy="70" rx="33" ry="8" fill="none" stroke="#9fe3ff" stroke-width="1.1" opacity="0.75" filter="url(#glow)"/>
    <g stroke="#e6f7ff" stroke-width="1.3" stroke-linecap="round" fill="none" filter="url(#glow)">
      <g transform="translate(50 42)"><path d="M0 -3.5 L0 3.5 M0 -3.5 L2.5 -2 M0 0 L2.5 1.5"/></g>
      <g transform="translate(30 40) scale(0.7 1)"><path d="M-3 3.5 L3 -3.5 M-3 -3.5 L3 3.5"/></g>
      <g transform="translate(70 40) scale(0.7 1)"><path d="M0 -3.5 L0 3.5 M-3 0 L3 0"/></g>
      <g transform="translate(50 63)"><path d="M0 -4 L0 4 M0 -2 L3 0 L0 2"/></g>
      <g transform="translate(25 60) scale(0.7 1)"><path d="M0 4 L0 -4 M0 -1 L-3 -4 M0 -1 L3 -4"/></g>
      <g transform="translate(75 60) scale(0.7 1)"><path d="M-3 -2 L0 -4 L3 -2 M0 -4 L0 4"/></g>
      <g transform="translate(50 78)"><path d="M-3 3.5 L0 -3.5 L3 3.5"/></g>
    </g>
  </g>
  <!-- central glyph -->
  <circle cx="50" cy="22" r="7" fill="none" stroke="#bfe9ff" stroke-width="1.3" filter="url(#glow)"/>
  <circle cx="50" cy="22" r="2.2" fill="#ffffff" filter="url(#glow)"/>
  <ellipse cx="37" cy="28" rx="12" ry="6.5" fill="#ffffff" opacity="0.26" transform="rotate(-25 37 28)"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#7cc4ff" stroke-width="1.5" filter="url(#glow)"/>
</svg>
